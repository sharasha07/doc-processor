services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docuser
      POSTGRES_PASSWORD: docpass
      POSTGRES_DB: docdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuser -d docdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://docuser:docpass@postgres:5432/docdb?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    platform: linux/amd64
    env_file: .env
    environment:
      DB_URL: postgres://docuser:docpass@postgres:5432/docdb?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_TTL: 24h
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  postgres_data:
